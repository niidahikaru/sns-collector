<!DOCTYPE html>
<html>
<head>
<base target="_top">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Google Sans', Arial, sans-serif;
    font-size: 13px;
    color: #202124;
    padding: 16px;
  }

  /* Steps indicator */
  .steps {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    margin-bottom: 16px;
  }
  .step-dot {
    width: 24px; height: 24px;
    border-radius: 50%;
    background: #e8eaed;
    color: #5f6368;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 600;
  }
  .step-dot.active { background: #1a73e8; color: #fff; }
  .step-dot.done { background: #34a853; color: #fff; }
  .step-line { width: 24px; height: 2px; background: #e8eaed; }
  .step-line.done { background: #34a853; }

  .step-title {
    font-size: 14px;
    font-weight: 600;
    color: #202124;
    margin-bottom: 12px;
  }

  /* Panels */
  .panel { display: none; }
  .panel.active { display: block; }

  /* Post preview */
  .post-preview {
    background: #f8f9fa;
    border: 1px solid #e8eaed;
    border-radius: 8px;
    padding: 12px;
    font-size: 13px;
    line-height: 1.6;
    white-space: pre-wrap;
    max-height: 200px;
    overflow-y: auto;
    margin-bottom: 8px;
  }
  .post-meta {
    font-size: 11px;
    color: #999;
    margin-bottom: 12px;
  }
  .post-empty {
    color: #999;
    font-style: italic;
    padding: 20px;
    text-align: center;
  }

  /* Form elements */
  label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: #5f6368;
    margin-bottom: 4px;
    margin-top: 12px;
  }
  label:first-child { margin-top: 0; }

  textarea {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid #dadce0;
    border-radius: 6px;
    font-size: 13px;
    font-family: inherit;
    outline: none;
    min-height: 40px;
    resize: vertical;
  }
  textarea:focus { border-color: #1a73e8; }
  textarea.instruction { min-height: 60px; }

  select {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid #dadce0;
    border-radius: 6px;
    font-size: 13px;
    font-family: inherit;
    outline: none;
    background: #fff;
  }
  select:focus { border-color: #1a73e8; }

  /* Checkbox list (power words) */
  .checkbox-list {
    margin-top: 4px;
  }
  .checkbox-item {
    display: flex;
    align-items: flex-start;
    gap: 6px;
    padding: 6px 8px;
    border: 1px solid #e8eaed;
    border-radius: 6px;
    margin-bottom: 4px;
    cursor: pointer;
  }
  .checkbox-item:hover { background: #f8f9fa; }
  .checkbox-item input[type="checkbox"] {
    margin-top: 2px;
    flex-shrink: 0;
  }
  .checkbox-item span {
    font-size: 13px;
    line-height: 1.4;
  }

  /* Stock section */
  .stock-section {
    margin-top: 16px;
    padding: 12px;
    background: #f0f7ff;
    border: 1px solid #c2deff;
    border-radius: 8px;
  }
  .stock-section-title {
    font-size: 13px;
    font-weight: 600;
    color: #1a73e8;
    margin-bottom: 8px;
  }
  .stock-item {
    margin-top: 8px;
  }
  .stock-item label {
    margin-top: 0;
    color: #1a73e8;
  }
  .stock-empty {
    color: #999;
    font-size: 12px;
    font-style: italic;
    padding: 8px 0;
  }

  /* Buttons */
  .btn-row {
    display: flex;
    gap: 8px;
    margin-top: 16px;
  }
  .btn {
    padding: 8px 16px;
    border: none;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    flex: 1;
    text-align: center;
  }
  .btn-primary { background: #1a73e8; color: #fff; }
  .btn-primary:hover { background: #1557b0; }
  .btn-primary:disabled { background: #a8c7fa; cursor: not-allowed; }
  .btn-secondary { background: #f1f3f4; color: #5f6368; flex: 0; white-space: nowrap; }
  .btn-secondary:hover { background: #e8eaed; }
  .btn-success { background: #34a853; color: #fff; }
  .btn-success:hover { background: #2d8f47; }

  /* Result */
  .result-text {
    background: #f8f9fa;
    border: 1px solid #e8eaed;
    border-radius: 8px;
    padding: 12px;
    font-size: 13px;
    line-height: 1.7;
    white-space: pre-wrap;
    max-height: 300px;
    overflow-y: auto;
  }

  /* Loading & error */
  .loading {
    display: none;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-top: 12px;
    color: #1a73e8;
    font-size: 13px;
  }
  .loading .spinner {
    width: 16px; height: 16px;
    border: 2px solid #1a73e8;
    border-top-color: transparent;
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .error-text {
    color: #c5221f;
    font-size: 12px;
    margin-top: 8px;
  }
  .saved-text {
    color: #34a853;
    font-size: 12px;
    margin-top: 8px;
    font-weight: 600;
  }
</style>
</head>
<body>

<!-- Steps indicator -->
<div class="steps" id="stepsIndicator">
  <div class="step-dot active" id="dot1">1</div>
  <div class="step-line" id="line1"></div>
  <div class="step-dot" id="dot2">2</div>
  <div class="step-line" id="line2"></div>
  <div class="step-dot" id="dot3">3</div>
</div>

<!-- Step 1: Select post & analyze -->
<div class="panel active" id="panel1">
  <div class="step-title">ベースの型を選ぶ</div>
  <div id="postPreviewArea">
    <div class="loading" style="display:flex;padding:20px 0;">
      <div class="spinner"></div>
      投稿を読み込み中...
    </div>
  </div>

  <div class="btn-row">
    <button class="btn btn-primary" id="btnAnalyze" onclick="handleAnalyze()">型を分析する</button>
  </div>
  <div class="loading" id="loading1">
    <div class="spinner"></div>
    分析中...
  </div>
  <div id="error1" class="error-text"></div>
</div>

<!-- Step 2: Review structure + save to stock + select stock + generate -->
<div class="panel" id="panel2">
  <div class="step-title">構造を確認・素材を選ぶ</div>

  <div id="structureFields"></div>

  <!-- Save to stock -->
  <div class="btn-row">
    <button class="btn btn-success" id="btnSaveStock" onclick="handleSaveStock()" style="font-size:12px;">ストックに保存</button>
  </div>
  <div id="stockSavedMsg" class="saved-text" style="display:none;"></div>

  <!-- Stock selection -->
  <div class="stock-section" id="stockSection">
    <div class="stock-section-title">ストックから素材を選ぶ（任意）</div>
    <div id="stockFields"></div>
  </div>

  <label style="margin-top:16px;">追加の指示（任意）</label>
  <textarea id="additionalInstructions" class="instruction" placeholder="例: 絵文字を多めに、500文字以内で"></textarea>

  <div class="btn-row">
    <button class="btn btn-secondary" onclick="goToStep(1)">戻る</button>
    <button class="btn btn-primary" id="btnGenerate" onclick="handleGenerate()">生成する</button>
  </div>
  <div class="loading" id="loading2">
    <div class="spinner"></div>
    生成中...
  </div>
  <div id="error2" class="error-text"></div>
</div>

<!-- Step 3: Result -->
<div class="panel" id="panel3">
  <div class="step-title">生成結果</div>
  <div class="result-text" id="resultText"></div>
  <div id="savedMsg" class="saved-text" style="display:none;"></div>
  <div id="error3" class="error-text"></div>
  <div class="btn-row">
    <button class="btn btn-success" id="btnSave" onclick="handleSave()">シートに保存</button>
  </div>
  <div class="btn-row">
    <button class="btn btn-secondary" onclick="goToStep(2)" style="flex:1;">再生成する</button>
    <button class="btn btn-secondary" onclick="restart()" style="flex:1;">最初から</button>
  </div>
</div>

<script>
  var currentStep = 1;
  var postText = '';
  var postLikes = '';
  var postId = '';
  var structure = null;
  var stockData = {};    // { "一文目": [{content, likes, postId}, ...], ... }

  // Init: load selected post
  google.script.run
    .withSuccessHandler(showPost)
    .withFailureHandler(function() { showPost(null); })
    .getSelectedPostText();

  function showPost(data) {
    var area = document.getElementById('postPreviewArea');
    if (data && data.text) {
      postText = data.text;
      postLikes = data.likes || '';
      postId = data.postId || '';
      area.innerHTML =
        '<div class="post-preview">' + escapeHtml(data.text) + '</div>' +
        (data.likes ? '<div class="post-meta">いいね ' + escapeHtml(data.likes) + '</div>' : '');
      document.getElementById('btnAnalyze').disabled = false;
    } else {
      area.innerHTML = '<div class="post-empty">シートで投稿がある行を選択してから<br>サイドバーを開いてください</div>';
      document.getElementById('btnAnalyze').disabled = true;
    }
  }

  function handleAnalyze() {
    if (!postText) return;

    document.getElementById('btnAnalyze').disabled = true;
    document.getElementById('loading1').style.display = 'flex';
    document.getElementById('error1').textContent = '';

    google.script.run
      .withSuccessHandler(onAnalyzeSuccess)
      .withFailureHandler(onAnalyzeError)
      .analyzePost(postText);
  }

  function onAnalyzeSuccess(result) {
    document.getElementById('loading1').style.display = 'none';
    document.getElementById('btnAnalyze').disabled = false;

    structure = result.structure;
    stockData = result.stock || {};

    renderStructureFields(structure);
    renderStockFields();
    goToStep(2);
  }

  function onAnalyzeError(error) {
    document.getElementById('loading1').style.display = 'none';
    document.getElementById('btnAnalyze').disabled = false;
    document.getElementById('error1').textContent = 'エラー: ' + error.message;
  }

  function renderStructureFields(s) {
    var container = document.getElementById('structureFields');
    var html = '';

    // 5カテゴリ（テキストエリア）
    var categories = [
      { key: 'hook', label: '冒頭フック' },
      { key: 'appeal', label: '訴求（理想の未来）' },
      { key: 'scarcity', label: '限定性' },
      { key: 'cta', label: '行動喚起' }
    ];

    for (var i = 0; i < categories.length; i++) {
      var cat = categories[i];
      var value = s[cat.key] || '';
      html += '<label>' + cat.label + '</label>';
      html += '<textarea id="field_' + cat.key + '">' + escapeHtml(value) + '</textarea>';
    }

    // 強ワード（チェックボックス）
    html += '<label>強いワード（ストック保存するものを選択）</label>';
    var words = s.powerWords || [];
    if (words.length > 0) {
      html += '<div class="checkbox-list" id="powerWordsList">';
      for (var j = 0; j < words.length; j++) {
        html += '<label class="checkbox-item">';
        html += '<input type="checkbox" name="powerWord" value="' + escapeHtml(words[j]) + '" checked>';
        html += '<span>' + escapeHtml(words[j]) + '</span>';
        html += '</label>';
      }
      html += '</div>';
    } else {
      html += '<div class="stock-empty">強ワードが検出されませんでした</div>';
    }

    // Extras
    if (s.extras && s.extras.length > 0) {
      for (var k = 0; k < s.extras.length; k++) {
        var extra = s.extras[k];
        html += '<label>' + escapeHtml(extra.name) + '</label>';
        html += '<textarea id="extra_' + k + '">' + escapeHtml(extra.value) + '</textarea>';
        html += '<input type="hidden" id="extra_name_' + k + '" value="' + escapeHtml(extra.name) + '">';
      }
    }

    container.innerHTML = html;

    // Reset save button
    document.getElementById('btnSaveStock').disabled = false;
    document.getElementById('stockSavedMsg').style.display = 'none';
  }

  function getCheckedPowerWords() {
    var checkboxes = document.querySelectorAll('input[name="powerWord"]:checked');
    var words = [];
    for (var i = 0; i < checkboxes.length; i++) {
      words.push(checkboxes[i].value);
    }
    return words;
  }

  function handleSaveStock() {
    var btn = document.getElementById('btnSaveStock');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner" style="width:12px;height:12px;display:inline-block;vertical-align:middle;margin-right:6px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;animation:spin 1s linear infinite;"></span>保存中...';
    document.getElementById('stockSavedMsg').style.display = 'none';

    var params = {
      hook: document.getElementById('field_hook').value.trim(),
      powerWords: getCheckedPowerWords(),
      appeal: document.getElementById('field_appeal').value.trim(),
      likes: postLikes,
      postId: postId
    };

    google.script.run
      .withSuccessHandler(function(result) {
        var btn = document.getElementById('btnSaveStock');
        btn.textContent = 'ストックに保存';
        if (result.success) {
          var msg = result.count > 0 ? result.count + '件をストックに保存しました' : 'この投稿は既にストック済みです';
          document.getElementById('stockSavedMsg').textContent = msg;
          document.getElementById('stockSavedMsg').style.display = 'block';
          stockData = result.stock || {};
          renderStockFields();
        } else {
          document.getElementById('stockSavedMsg').style.display = 'none';
          btn.disabled = false;
        }
      })
      .withFailureHandler(function() {
        var btn = document.getElementById('btnSaveStock');
        btn.textContent = 'ストックに保存';
        btn.disabled = false;
      })
      .saveSelectedToStock(params);
  }

  function renderStockFields() {
    var container = document.getElementById('stockFields');
    var types = Object.keys(stockData);

    if (types.length === 0) {
      container.innerHTML = '<div class="stock-empty">まだストックがありません</div>';
      return;
    }

    var html = '';
    for (var i = 0; i < types.length; i++) {
      var type = types[i];
      var items = stockData[type];
      html += '<div class="stock-item">';
      html += '<label>' + escapeHtml(type) + '</label>';
      html += '<select id="stock_' + i + '" data-type="' + escapeHtml(type) + '">';
      html += '<option value="">-- 選択しない --</option>';
      for (var j = 0; j < items.length; j++) {
        var item = items[j];
        var display = item.content;
        if (display.length > 50) display = display.substring(0, 50) + '...';
        if (item.likes) display += ' (いいね' + item.likes + ')';
        html += '<option value="' + escapeHtml(item.content) + '">' + escapeHtml(display) + '</option>';
      }
      html += '</select>';
      html += '</div>';
    }

    container.innerHTML = html;
  }

  function collectStructure() {
    var keys = ['hook', 'appeal', 'scarcity', 'cta'];
    var result = {};
    for (var i = 0; i < keys.length; i++) {
      var el = document.getElementById('field_' + keys[i]);
      result[keys[i]] = el ? el.value.trim() : '';
    }
    result.powerWords = getCheckedPowerWords();

    // Collect extras
    result.extras = [];
    var j = 0;
    while (document.getElementById('extra_' + j)) {
      var name = document.getElementById('extra_name_' + j).value;
      var value = document.getElementById('extra_' + j).value.trim();
      if (name && value) {
        result.extras.push({ name: name, value: value });
      }
      j++;
    }

    return result;
  }

  function collectStockElements() {
    var elements = [];
    var types = Object.keys(stockData);
    for (var i = 0; i < types.length; i++) {
      var sel = document.getElementById('stock_' + i);
      if (sel && sel.value) {
        elements.push({
          type: sel.getAttribute('data-type'),
          content: sel.value
        });
      }
    }
    return elements;
  }

  function getUnselectedStock() {
    // 選択されていない要素タイプの全候補を返す
    var selected = {};
    var types = Object.keys(stockData);
    for (var i = 0; i < types.length; i++) {
      var sel = document.getElementById('stock_' + i);
      if (sel && sel.value) {
        selected[sel.getAttribute('data-type')] = true;
      }
    }
    var unselected = {};
    for (var j = 0; j < types.length; j++) {
      var type = types[j];
      if (!selected[type]) {
        unselected[type] = stockData[type].map(function(item) { return item.content; });
      }
    }
    return unselected;
  }

  function handleGenerate() {
    var params = {
      structure: collectStructure(),
      stockElements: collectStockElements(),
      unselectedStock: getUnselectedStock(),
      additionalInstructions: document.getElementById('additionalInstructions').value.trim()
    };

    document.getElementById('btnGenerate').disabled = true;
    document.getElementById('loading2').style.display = 'flex';
    document.getElementById('error2').textContent = '';

    google.script.run
      .withSuccessHandler(onGenerateSuccess)
      .withFailureHandler(onGenerateError)
      .generateFromStructure(params);
  }

  function onGenerateSuccess(result) {
    document.getElementById('loading2').style.display = 'none';
    document.getElementById('btnGenerate').disabled = false;

    if (result.success) {
      document.getElementById('resultText').textContent = result.text;
      document.getElementById('savedMsg').style.display = 'none';
      document.getElementById('btnSave').disabled = false;
      goToStep(3);
    } else {
      document.getElementById('error2').textContent = 'エラー: ' + (result.error || '不明なエラー');
    }
  }

  function onGenerateError(error) {
    document.getElementById('loading2').style.display = 'none';
    document.getElementById('btnGenerate').disabled = false;
    document.getElementById('error2').textContent = 'エラー: ' + error.message;
  }

  function handleSave() {
    var text = document.getElementById('resultText').textContent;
    document.getElementById('btnSave').disabled = true;
    document.getElementById('error3').textContent = '';

    google.script.run
      .withSuccessHandler(function(result) {
        if (result.success) {
          document.getElementById('savedMsg').textContent = 'シートに保存しました';
          document.getElementById('savedMsg').style.display = 'block';
        } else {
          document.getElementById('error3').textContent = '保存エラー: ' + (result.error || '');
          document.getElementById('btnSave').disabled = false;
        }
      })
      .withFailureHandler(function(error) {
        document.getElementById('error3').textContent = '保存エラー: ' + error.message;
        document.getElementById('btnSave').disabled = false;
      })
      .saveGeneratedPost(text);
  }

  function restart() {
    structure = null;
    stockData = {};
    document.getElementById('additionalInstructions').value = '';
    document.getElementById('savedMsg').style.display = 'none';
    goToStep(1);
  }

  function goToStep(step) {
    currentStep = step;
    for (var i = 1; i <= 3; i++) {
      document.getElementById('panel' + i).className = 'panel' + (i === step ? ' active' : '');
    }
    for (var j = 1; j <= 3; j++) {
      var dot = document.getElementById('dot' + j);
      dot.className = 'step-dot' + (j === step ? ' active' : (j < step ? ' done' : ''));
    }
    document.getElementById('line1').className = 'step-line' + (step > 1 ? ' done' : '');
    document.getElementById('line2').className = 'step-line' + (step > 2 ? ' done' : '');
  }

  function escapeHtml(text) {
    var div = document.createElement('div');
    div.textContent = text || '';
    return div.innerHTML;
  }
</script>

</body>
</html>
