<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <h1 id="title">SNS投稿収集</h1>

  <div class="section">
    <label for="gasUrl">GAS URL</label>
    <input type="text" id="gasUrl" placeholder="https://script.google.com/macros/s/.../exec">
    <div class="save-indicator" id="saveIndicator">保存しました</div>
  </div>

  <div class="btn-row">
    <button id="btnStart">収集開始</button>
    <button id="btnStop" disabled>収集停止</button>
  </div>

  <div id="status">待機中</div>

  <div id="healthAlert" class="health-alert" style="display:none;"></div>

  <div class="realtime-note">収集した投稿はリアルタイムでスプレッドシートに反映されます</div>

  <script src="popup.js"></script>
</body>
</html>
